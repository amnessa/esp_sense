; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; esp-dl ships with the core and is already on the linker line
; (-lhuman_face_detect -ldl), but PlatformIO's build script leaves its headers
; off CPPPATH, so they have to be added by hand.
build_flags =
    ; Detector tuning. RESIZE_SCALE is the one that matters most: it sets the
    ; image size the network actually sees, and so the smallest face that can
    ; be found. 0.2 (the reference example's value) was starving it.
    -DDETECT_RESIZE_SCALE=0.5F
    ; First-stage threshold. Keep it loose at 0.1 while TWO_STAGE=1, since the
    ; second stage does the filtering; raise to ~0.3 if you turn TWO_STAGE off.
    -DDETECT_SCORE=0.1F
    -DDETECT_TWO_STAGE=1
    -DDETECT_STATS=1
    -I "${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32s3/include/esp-dl/include"
    -I "${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32s3/include/esp-dl/include/tool"
    -I "${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32s3/include/esp-dl/include/typedef"
    -I "${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32s3/include/esp-dl/include/image"
    -I "${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32s3/include/esp-dl/include/math"
    -I "${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32s3/include/esp-dl/include/nn"
    -I "${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32s3/include/esp-dl/include/layer"
    -I "${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32s3/include/esp-dl/include/detect"
    -I "${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32s3/include/esp-dl/include/model_zoo"

[platformio]
description = esp32 s3 sense playzone
; Plain `pio run` / the VSCode build button keep building the camera project.
; The servo bench is opt-in: pio run -e servo_test -t upload -t monitor
default_envs = seeed_xiao_esp32s3

; Standalone servo bench. Builds servo_test/servo_test.cpp INSTEAD of src/,
; so nothing in the camera project is compiled, linked, or affected.
[env:servo_test]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../servo_test/>
; Make the serial monitor usable as a command prompt:
;   send_on_enter -- buffer the line locally and transmit it when you hit Enter
;                    (without this, miniterm ships every keystroke as you type)
;   monitor_echo  -- show what you are typing; the filter does not echo on its own
;   monitor_eol   -- must match the filter's terminator and what the sketch parses
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF
